<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TRN-7 • THE ESOTERIC</title>
  <meta name="theme-color" content="#050201"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/mother.css"/>
</head>

<body>
  <main id="stage" aria-label="terminal stage">
    <div id="crt" class="crt">
    <canvas id="noise" class="noise"></canvas>

      <div class="glass" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="chromatic" aria-hidden="true"></div>
      <div class="fuzz" id="fuzz" aria-hidden="true"></div>

      <section id="screen" class="screen" aria-label="terminal screen">
        <header class="topbar" aria-hidden="true">
          <div class="lamp"></div>
          <div class="lamp"></div>
          <div class="badge">TRN-7</div>
        </header>

        <div class="terminal">
          <pre id="console" class="console" aria-live="polite"></pre>

          <form id="promptForm" class="prompt" autocomplete="off">
            <span class="prompt-label">></span>
            <input
              id="promptInput"
              class="prompt-input"
              type="text"
              inputmode="text"
              spellcheck="false"
              autocapitalize="none"
              autocomplete="off"
              aria-label="terminal input"
            />
          </form>

          <div class="hint" id="hint" aria-hidden="true">
            AWAITING INPUT_
          </div>
        </div>
      </section>
    </div>
  </main>

  <script defer src="./js/mother.js"></script>
</body>
</html>
